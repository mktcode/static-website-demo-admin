backend:
  name: github
  repo: mktcode/static-website-demo
  branch: main
  squash_merges: true
  cms_label_prefix: redaktion/

app_title: DynaMesh Redaktion
logo:
  src: /logo.png
  show_in_header: true

publish_mode: editorial_workflow
site_url: https://mktcode.github.io/static-website-demo/
display_url: https://mktcode.github.io/static-website-demo/
media_folder: content/media
public_folder: content/media

i18n:
  structure: multiple_folders
  locales: [en, de]
  default_locale: en
  initial_locales: all

collections:
  - name: pages
    label: Seiten
    label_singular: Seite
    folder: content/pages
    create: true
    # Protect the homepages as well. Deletions can still be reviewed on GitHub.
    delete: false
    i18n: true
    format: yaml-frontmatter
    extension: md
    slug: "{{slug}}"
    fields:
      - name: title
        label: Titel
        widget: string
        i18n: true
      - name: hero_image
        label: Hero-Bild
        widget: image
        i18n: true
        required: false
        hint: "Bild für diese Sprache auswählen oder hochladen. Ohne Auswahl wird das bisherige Standardbild verwendet."
      - name: hero_alt
        label: Bildbeschreibung (Alternativtext)
        widget: string
        i18n: true
        required: false
        hint: "Bild in dieser Sprache beschreiben; enthaltenen Text sinngemäß wiedergeben. Bei einem rein dekorativen Bild leer lassen."
      - name: body
        label: Inhalt
        widget: markdown
        i18n: true
        hint: "Die Hauptüberschrift wird aus dem Titel erzeugt. Weitere Überschriften im Inhalt ab Ebene 2 verwenden."
